<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Velocity cover art: low-poly car wireframe with chrome speed streaks on near-black background">
  <defs>
    <linearGradient id="vl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c0e"/>
      <stop offset="70%" stop-color="#0e1319"/>
      <stop offset="100%" stop-color="#182430"/>
    </linearGradient>
    <linearGradient id="vl-streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#c9d6e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vl-horizon" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#3f6f8f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3f6f8f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#vl-bg)"/>
  <ellipse cx="600" cy="760" rx="620" ry="180" fill="url(#vl-horizon)"/>

  <g stroke-linecap="round">
    <rect x="-100" y="150" width="900" height="10" fill="url(#vl-streak)" transform="rotate(-12 350 155)"/>
    <rect x="-60" y="230" width="700" height="6" fill="url(#vl-streak)" transform="rotate(-12 290 233)"/>
    <rect x="500" y="90" width="850" height="8" fill="url(#vl-streak)" transform="rotate(-12 925 94)"/>
    <rect x="650" y="250" width="600" height="5" fill="url(#vl-streak)" transform="rotate(-12 950 252)"/>
  </g>

  <g fill="none" stroke="#9fb4c4" stroke-width="2.5" stroke-linejoin="round">
    <path d="M180 560 L260 480 L360 450 L520 440 L640 460 L780 450 L900 480 L1000 540 L1000 590 L900 600 L840 590 L360 590 L300 600 L180 590 Z"/>
    <path d="M360 450 L420 400 L620 395 L760 430 L640 460 L520 440 Z"/>
    <line x1="180" y1="560" x2="1000" y2="560"/>
    <circle cx="330" cy="600" r="42"/>
    <circle cx="860" cy="600" r="42"/>
    <line x1="480" y1="440" x2="480" y2="590"/>
    <line x1="700" y1="440" x2="700" y2="590"/>
  </g>
</svg>
